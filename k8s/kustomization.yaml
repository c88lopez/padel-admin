# Everything padel-admin runs in the cluster. Argo CD deploys it (the
# padel-admin Application in the platform repo) whenever main changes.
#
# The version that runs is the newTag below. Image Updater changes it when CI
# pushes a release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - app/10-configmap.yaml
  - app/20-deployment.yaml
  - app/30-service.yaml
  - app/40-podmonitor.yaml
  - app/50-hpa.yaml
  - jobs/migrate.yaml # PreSync hook: runs before the rest
  # Not dev/: those databases are for local runs, not part of a deploy.

images:
  - name: ghcr.io/c88lopez/padel-admin
    newTag: 0.1.26
    newName: ghcr.io/c88lopez/padel-admin

# The Grafana dashboard. Grafana's sidecar loads any ConfigMap labeled
# grafana_dashboard, from any namespace, into the folder in grafana_folder.
# That folder ends up under Services: platform's grafana-folders Job nests it
# (the provisioner only makes top-level folders).
configMapGenerator:
  - name: padel-admin-dashboard
    namespace: padel-admin
    files: [dashboards/padel-admin.json]

generatorOptions:
  # Keep the name stable (no content hash suffix): nothing mounts it, the
  # sidecar watches it, so there's nothing a new name would roll out.
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Padel Admin
