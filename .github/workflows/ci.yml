name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detects whether any non-docs, non-workflow file changed. The heavy jobs
  # (build, integration, e2e) gate on this so edits to `.github/**` or markdown
  # docs don't spin up Postgres / Playwright. Jobs skipped via `if:` still
  # satisfy their required status check, so auto-merge isn't blocked (unlike
  # skipping the whole workflow with `on.paths`, which leaves required checks
  # pending forever).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # `every`: a file counts as "code" only if it matches ALL patterns
          # below (i.e. it is neither under .github/ nor a markdown doc).
          predicate-quantifier: every
          filters: |
            code:
              - '!.github/**'
              - '!**/*.md'

  quality:
    name: Typecheck, lint, format & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run check

      - name: Test (with coverage)
        run: bun run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          f=coverage/coverage-summary.json
          if [ -f "$f" ]; then
            {
              echo "### Unit coverage (src/lib)"
              echo ""
              echo "| Metric | % | Covered / Total |"
              echo "| --- | --- | --- |"
              for m in statements branches functions lines; do
                pct=$(jq -r ".total.$m.pct" "$f")
                cov=$(jq -r ".total.$m.covered" "$f")
                tot=$(jq -r ".total.$m.total" "$f")
                echo "| $m | ${pct}% | ${cov} / ${tot} |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 7

  build:
    name: Build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  integration:
    name: Integration tests (Postgres)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Log test database URL
        run: echo "DATABASE_URL_TEST=$DATABASE_URL_TEST"

      - name: Run integration tests
        run: bun run test:integration

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # Not ubuntu-latest: Playwright 1.60 can't install Chromium's dependencies
    # on Ubuntu 26.04. Move back once Playwright supports it.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      BETTER_AUTH_SECRET: e2e-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3100
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Playwright's test runner is most reliable under Node; the app server it
      # launches is the production build (`bun run build` + Nitro node output).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Seed demo data
        run: bun run db:seed:demo

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Builds the image, smoke-tests it, and pushes it to GitHub Container
  # Registry, once everything above passed:
  #   push to main   -> :main, :sha-<short>, then the release job's version tags
  #   pull request   -> :pr-<number>, :sha-<short>, to try a branch in the
  #                     cluster (a fork's PR only builds: its token can't push)
  # Image Updater deploys only x.y.z tags, so none of these deploy on their own.
  image:
    name: Image
    needs: [changes, quality, build, integration, e2e]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/padel-admin
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - uses: docker/setup-buildx-action@v3

      # Starts the amd64 image the way the Deployment runs it (non-root,
      # read-only root filesystem, tracing on) and waits for /api/healthz, before
      # anything is pushed. No database: the liveness route doesn't need one.
      # Nothing listens on the OTLP endpoint; failed exports are only logged.
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: padel-admin:smoke
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run -d --name smoke --read-only --user 65532:65532 -p 3000:3000 \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 padel-admin:smoke
          for i in $(seq 1 30); do
            if curl -sf localhost:3000/api/healthz; then echo; exit 0; fi
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || break
            sleep 1
          done
          docker logs smoke
          exit 1

      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The cluster node is amd64; arm64 runs the same image on a Mac.
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every push to main whose code changed is released: the patch goes up, or
  # the minor when the merged PR has the release:minor label (the first
  # release is 0.1.0). The image pushed above gets the version's tags without
  # a rebuild, and Image Updater deploys it. The git tag is pushed with
  # GITHUB_TOKEN, which doesn't start workflows.
  release:
    name: Release
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One release at a time, so two merges can't take the same version.
    concurrency:
      group: release
    permissions:
      contents: write # pushes the git tag
      packages: write
      pull-requests: read # the merged PR's labels
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/padel-admin
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags

      - id: version
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD is already released: $(git tag --points-at HEAD)"
            exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            version=0.1.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name')
            if grep -qx 'release:minor' <<< "$labels"; then
              minor=$((minor + 1)) patch=0
            else
              patch=$((patch + 1))
            fi
            version=$major.$minor.$patch
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "${last:-none} -> $version" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.version.outputs.version
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.version.outputs.version
        uses: docker/setup-buildx-action@v3

      - if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:${VERSION%.*}" -t "$IMAGE:latest" \
            "$IMAGE:sha-${GITHUB_SHA::7}"
          git tag "v$VERSION"
          git push origin "v$VERSION"
